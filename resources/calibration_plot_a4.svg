  <circle cx="62.0" cy="121.0" r="10.0" fill="none" stroke="#1976d2" stroke-width="0.35"/>
  <circle cx="62.0" cy="121.0" r="20.0" fill="none" stroke="#388e3c" stroke-width="0.35"/>
