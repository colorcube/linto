<svg xmlns="http://www.w3.org/2000/svg" width="297.0mm" height="210.0mm" viewBox="0 0 297.0 210.0">
  <style>
    text { font-family: "DejaVu Sans", "Helvetica", "Arial", sans-serif; font-size: 3.5px; fill: #1a1a1a; }
    .title { font-size: 5px; font-weight: bold; }
    .edge-label { font-size: 3.2px; font-weight: bold; fill: #d32f2f; }
    .axis-label { font-size: 4px; font-weight: bold; }
  </style>
  <!-- Sheet border (physical paper: 297.0 x 210.0 mm) -->
  <rect x="0" y="0" width="297.0" height="210.0" fill="none" stroke="#cbd5e1" stroke-width="0.2" stroke-dasharray="2,2"/>
  <!-- Plottable Boundary (EXP: Top 25mm, Bottom 5mm, Left/Right 5mm) -->
  <rect x="5.0" y="25.0" width="287.0" height="180.0" fill="none" stroke="#1a1a1a" stroke-width="0.35"/>
  <!-- Inner border (2mm offset) -->
  <rect x="7.0" y="27.0" width="283.0" height="176.0" fill="none" stroke="#1a1a1a" stroke-width="0.25"/>
  <text x="148.5" y="23.0" text-anchor="middle" class="edge-label">▲ VORSCHUB-KANTE (TOP / LEADING EDGE: SOLL-ABSTAND 25.0 mm) ▲</text>
  <text x="148.5" y="208.5" text-anchor="middle" class="edge-label">▼ HINTERKANTE (BOTTOM: SOLL-ABSTAND 5.0 mm) ▼</text>
  <text x="2" y="115.0" text-anchor="middle" transform="rotate(-90 2 115.0)" class="edge-label">◄ LINKS (SOLL 5.0 mm)</text>
  <text x="295.5" y="115.0" text-anchor="middle" transform="rotate(90 295.5 115.0)" class="edge-label">RECHTS (SOLL 5.0 mm) ►</text>
  <text x="11.0" y="35.0" class="title">MUTOH XP-500 KALIBRIER- &amp; TESTPLOT (DIN A4 QUER)</text>
  <text x="11.0" y="40.0">Plotter Studio Hardware-Verifikation · AP0 Testplan · Maße in Millimeter</text>
  <!-- Orientation Coordinate System -->
  <g stroke="#d32f2f" stroke-width="0.5" fill="none">
    <line x1="20.0" y1="60.0" x2="45.0" y2="60.0"/>
    <polyline points="42.0,58.0 45.0,60.0 42.0,62.0"/>
    <line x1="20.0" y1="60.0" x2="20.0" y2="85.0"/>
    <polyline points="18.0,82.0 20.0,85.0 22.0,82.0"/>
  </g>
  <text x="47.0" y="61.2" class="axis-label" fill="#d32f2f">+X (Vorschub / Rollenvorschub)</text>
  <text x="19.0" y="90.0" class="axis-label" fill="#d32f2f">+Y (Wagen / Stiftachse)</text>
  <!-- Precision Scale Ruler (X-Axis) -->
  <g stroke="#1a1a1a" stroke-width="0.35">
    <line x1="23.5" y1="105.0" x2="273.5" y2="105.0"/>
    <line x1="23.5" y1="101.0" x2="23.5" y2="109.0"/>
  </g>
  <text x="23.5" y="100.0" text-anchor="middle">0 mm</text>
