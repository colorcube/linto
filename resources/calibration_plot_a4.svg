  </g>
  <text x="73.5" y="100.0" text-anchor="middle">50 mm</text>
  <g stroke="#1a1a1a" stroke-width="0.35">
    <line x1="123.5" y1="101.0" x2="123.5" y2="109.0"/>
  </g>
  <text x="123.5" y="100.0" text-anchor="middle">100 mm</text>
  <g stroke="#1a1a1a" stroke-width="0.35">
    <line x1="173.5" y1="102.5" x2="173.5" y2="107.5"/>
  </g>
