  <text x="42.0" y="52.2" class="axis-label" fill="#d32f2f">+X (Vorschub / Rollenvorschub)</text>
  <text x="25.0" y="68.0" class="axis-label" fill="#d32f2f">+Y (Wagen / Stiftachse)</text>
