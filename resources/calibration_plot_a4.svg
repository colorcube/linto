  <g stroke="#1a1a1a" stroke-width="0.35">
  </g>
  <text x="148.5" y="113.0" text-anchor="middle" font-weight="bold">MASSTABSPRÜFUNG: EXAKT 250.0 mm (MIT STAHLMASSSTAB MESSEN)</text>
  <!-- Precision Scale Ruler (Y-Axis) -->
  <g stroke="#1a1a1a" stroke-width="0.35">
    <line x1="262.0" y1="45.0" x2="262.0" y2="185.0"/>
