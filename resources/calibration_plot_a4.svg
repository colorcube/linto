    <polyline points="36.0,49.0 39.0,51.0 36.0,53.0"/>
    <line x1="21.0" y1="51.0" x2="21.0" y2="69.0"/>
    <polyline points="19.0,66.0 21.0,69.0 23.0,66.0"/>
