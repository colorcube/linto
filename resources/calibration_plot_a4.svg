<svg xmlns="http://www.w3.org/2000/svg" width="297.0mm" height="210.0mm" viewBox="0 0 297.0 210.0">
  <style>
    text { font-family: "DejaVu Sans", "Helvetica", "Arial", sans-serif; font-size: 3.2px; fill: #1a1a1a; }
    .title { font-size: 4.5px; font-weight: bold; }
    .section-title { font-size: 3.5px; font-weight: bold; }
    .edge-label { font-size: 2.8px; font-weight: bold; fill: #d32f2f; }
    .axis-label { font-size: 3.4px; font-weight: bold; }
  </style>
  <!-- Plottable Boundary (EXP: Top 25mm, Bottom 5mm, Left/Right 5mm) -->
  <rect x="5.0" y="25.0" width="287.0" height="180.0" fill="none" stroke="#1a1a1a" stroke-width="0.35"/>
  <!-- Inner border (2mm offset) -->
  <rect x="7.0" y="27.0" width="283.0" height="176.0" fill="none" stroke="#1a1a1a" stroke-width="0.25"/>
  <text x="148.5" y="30.5" text-anchor="middle" class="edge-label">▲ VORSCHUB-KANTE / LEADING EDGE (SOLL-ABSTAND OBEN: 25.0 mm) ▲</text>
  <text x="148.5" y="201.5" text-anchor="middle" class="edge-label">▼ HINTERKANTE / TRAILING EDGE (SOLL-ABSTAND UNTEN: 5.0 mm) ▼</text>
  <text x="10.5" y="115.0" text-anchor="middle" transform="rotate(-90 10.5 115.0)" class="edge-label">▲ LINKS (SOLL: 5.0 mm) ▲</text>
  <text x="286.5" y="115.0" text-anchor="middle" transform="rotate(90 286.5 115.0)" class="edge-label">▲ RECHTS (SOLL: 5.0 mm) ▲</text>
  <text x="19.0" y="38.5" class="title">KALIBRIER- &amp; TESTPLOT (DIN A4 QUER)</text>
  <text x="19.0" y="44.0">Maße in Millimeter</text>
  <!-- Orientation Coordinate System -->
  <g stroke="#d32f2f" stroke-width="0.5" fill="none">
