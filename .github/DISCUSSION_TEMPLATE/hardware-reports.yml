title: "[Hardware] "
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        Only the Mutoh XP-500 has been tested on real hardware so far. Your report helps to verify and fix the other device profiles, whether your plotter works perfectly or not at all.
  - type: input
    id: plotter
    attributes:
      label: Plotter model
      placeholder: Roland DXY-1300
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Device profile used in LINTO
      placeholder: hpgl_generic, roland_cm_24, own profile, ...
    validations:
      required: true
  - type: input
    id: connection
    attributes:
      label: Connection and settings
      description: Port type, baud rate, flow control (RTS/CTS or XON/XOFF), and the emulation/language set on the plotter if it has one.
      placeholder: USB-serial adapter (FTDI), 9600 8N1, RTS/CTS, HP-GL
    validations:
      required: true
  - type: checkboxes
    id: results
    attributes:
      label: What worked?
      options:
        - label: Connecting to the plotter
        - label: Probing the plotter (Query Plotter / hard-clip limits)
        - label: Plotting a complete drawing
        - label: Correct size and position on the sheet (e.g. 100 mm square measures 100 mm)
        - label: Pen changes with several pens
        - label: Pause, resume and abort
  - type: input
    id: version
    attributes:
      label: LINTO version
      description: Output of `linto --version`.
      placeholder: linto 0.1.0
  - type: textarea
    id: notes
    attributes:
      label: Details
      description: What went wrong, what you had to change, photos of the plot. Paste a modified device profile (YAML) here if you made one.
