  </style>
  <!-- Plottable Boundary (EXP: Top 25mm, Bottom 5mm, Left/Right 5mm) -->
  <rect x="5.0" y="25.0" width="410.0" height="267.0" fill="none" stroke="#1a1a1a" stroke-width="0.35"/>
