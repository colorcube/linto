<svg xmlns="http://www.w3.org/2000/svg" width="420.0mm" height="297.0mm" viewBox="0 0 420.0 297.0">
  <style>
    text { font-family: "DejaVu Sans", "Helvetica", "Arial", sans-serif; font-size: 3.2px; fill: #1a1a1a; }
