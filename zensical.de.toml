[project]
site_name = "Plotter Studio – Benutzerhandbuch"
site_description = "Modulares Slicer- und Layout-Studio für Vektor-Stiftplotter"
site_author = "Plotter Studio Contributors"
copyright = "Copyright &copy; 2026 Plotter Studio Contributors – GPL-3.0-or-later"
docs_dir = "docs/manual/de"
site_dir = "site/handbuch"

nav = [
  { "Überblick" = "README.md" },
  { "1. Schnellstart & Workflow" = "1-schnellstart-und-workflow.md" },
  { "2. Layout & Objektverwaltung" = "2-layout-und-objektverwaltung.md" },
  { "3. Ausgabe, Simulation & Export" = "3-ausgabe-simulation-export.md" },
  { "4. Hardware-Setup & Diagnose" = "4-hardware-setup-und-test.md" },
  { "5. Plottermodelle & Geräteprofile" = "5-plottermodelle-und-geraeteprofile.md" },
  { "6. Vektorformate & Workflows" = "6-vektorformate-und-workflows.md" },
  { "7. Konzepte & Architektur" = "7-konzepte-und-architektur.md" },
  { "8. Ressourcen & Community" = "8-ressourcen-tools-und-community.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "de"
font = false
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/pen-tool"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "blue-grey"
accent = "teal"
toggle.icon = "lucide/sun-moon"
toggle.name = "Zum hellen Design wechseln"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue-grey"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Zum dunklen Design wechseln"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue-grey"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Systemeinstellung verwenden"

[project.plugins.offline]
enabled = true

[project.plugins.glightbox]
enabled = true

[project.plugins.gh-admonitions]
enabled = true

[project.extra]
homepage = "index.html"
polyfills = [
  { path = "js/iframe-worker-shim.js", type = "text/javascript", async = false, defer = false },
]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
