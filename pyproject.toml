[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linto"
dynamic = ["version"]
description = "Slicer, layout editor and streaming controller for HP-GL pen plotters"
readme = "README.md"
authors = [{ name = "René Fritz", email = "rf@colorcube.de" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
keywords = ["pen plotter", "plotter", "hpgl", "hp-gl", "svg", "slicer", "path optimization", "serial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Printing",
]
dependencies = [
    "PySide6>=6.5.0",
    "numpy>=1.24.0",
    "svgelements>=1.7.0",
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/colorcube/linto"
Documentation = "https://colorcube.github.io/linto/manual/"
Issues = "https://github.com/colorcube/linto/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "zensical>=0.0.70",
]
docs = [
    "zensical>=0.0.70",
]

[project.scripts]
linto = "linto.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "linto.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linto = ["resources/*", "resources/**/*"]
