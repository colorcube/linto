[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linto"
version = "0.1.0"
description = "Modular Slicer and Studio for Pen Plotters under Linux"
readme = "README.md"
authors = [{ name = "LINTO Contributors" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5.0",
    "numpy>=1.24.0",
    "svgelements>=1.9.0",
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/colorcube/linto"
Documentation = "https://colorcube.github.io/linto/manual/"
Issues = "https://github.com/colorcube/linto/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "zensical>=0.0.70",
]
docs = [
    "zensical>=0.0.70",
]

[project.scripts]
linto = "linto.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linto = ["resources/*", "resources/**/*"]
