[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plotter-studio"
version = "0.1.0"
description = "Modular Slicer and Studio for Pen Plotters under Linux"
readme = "README.md"
authors = [{ name = "Plotter Studio Contributors" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5.0",
    "numpy>=1.24.0",
    "svgelements>=1.9.0",
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
plotter-studio = "plotter_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
