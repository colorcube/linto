<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="200mm" viewBox="0 0 200 200">
  <!-- Outer 200x200 mm frame -->
  <rect x="0" y="0" width="200" height="200" fill="none" stroke="#1a1a1a" stroke-width="0.35"/>
  <!-- Inner 180x180 mm frame -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#1a1a1a" stroke-width="0.35"/>
  <!-- Center Cross -->
  <line x1="100" y1="10" x2="100" y2="190" stroke="#d32f2f" stroke-width="0.35"/>
  <line x1="10" y1="100" x2="190" y2="100" stroke="#d32f2f" stroke-width="0.35"/>
  <!-- 50 mm circles -->
  <circle cx="100" cy="100" r="25" fill="none" stroke="#1976d2" stroke-width="0.35"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="#1976d2" stroke-width="0.35"/>
  <circle cx="100" cy="100" r="75" fill="none" stroke="#388e3c" stroke-width="0.35"/>
</svg>
